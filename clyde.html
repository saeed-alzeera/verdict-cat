<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clyde</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<script>if (localStorage.getItem('hub_auth') !== '1') location.replace('index.html');</script>
<script src="gist.js?v=4"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d23; --border: #2e3238; --text: #e8eaed;
    --muted: #8b9099; --accent: #5b9bd5; --ok: #5bb98b; --danger: #d94f4f; --bar-h: 52px;
  }
  html, body {
    min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  #topbar {
    position: sticky; top: 0; height: var(--bar-h); background: var(--surface);
    border-bottom: 1px solid var(--border); display: flex; align-items: center;
    padding: 0 20px; gap: 16px; z-index: 100;
  }
  #topbar a { color: var(--muted); text-decoration: none; font-size: 13px; }
  #topbar a:hover { color: var(--accent); }
  #topbar h1 { font-size: 15px; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical; background: var(--surface);
    color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); }
  #msg { font-size: 13px; min-height: 1.4em; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--danger); }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 32px 0 10px; text-transform: uppercase; letter-spacing: .05em; }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .item .p { white-space: pre-wrap; word-break: break-word; font-size: 13px; max-height: 5.5em; overflow: hidden; }
  .item .m { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .item .m button { background: none; color: var(--accent); padding: 0; font-size: 11px; font-weight: 400; }
  #out { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 16px; display: none; word-break: break-word; }
  #out h1,#out h2,#out h3,#out h4 { margin: 14px 0 6px; font-size: 1.05em; color: var(--text); text-transform: none; letter-spacing: 0; }
  #out h1:first-child,#out h2:first-child,#out h3:first-child { margin-top: 0; }
  #out p { margin: 8px 0; } #out ul,#out ol { margin: 8px 0 8px 22px; }
  #out pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 10px 0; }
  #out code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  #out pre code { background: none; padding: 0; }
  #out blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin: 8px 0; }
  #out hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .item .st { color: var(--muted); }
</style>
</head>
<body>
<div id="topbar">
  <a href="index.html">&#8592; Hub</a>
  <h1>Clyde</h1>
</div>
<main>
  <label for="prompt">Prompt</label>
  <textarea id="prompt" placeholder="What should Clyde do?"></textarea>
  <div class="row">
    <button id="run">Send</button>
    <span class="hint">Ctrl/&#8984;+Enter to send</span>
  </div>
  <div class="row"><div id="msg"></div></div>
  <div id="out"></div>
  <div id="reply" style="display:none">
    <label for="replyText">Reply</label>
    <textarea id="replyText" style="min-height:90px" placeholder="Follow up…"></textarea>
    <div class="row"><button id="replyBtn">Send reply</button><span class="hint">Starts a new run that includes this conversation.</span></div>
  </div>
  <h2>Recent</h2>
  <div id="history"></div>
</main>
<script>
  var KEY = 'clyde-history';
  var WORKER = 'https://verdict-cat-sync.saeed-a-alzeera.workers.dev';
  var POLL_MS = 4000, GIVE_UP_MS = 11 * 60 * 1000;
  var $ = function (id) { return document.getElementById(id); };
  var pollers = {}, viewing = null;

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 30))); } catch (e) {} }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function update(id, patch) {
    var list = load(), it = find(list, id);
    if (it) { for (var k in patch) it[k] = patch[k]; save(list); }
  }

  function setMsg(text, cls) { var m = $('msg'); m.className = cls || ''; m.textContent = text; }

  // ── Markdown → safe HTML. Everything is escaped first; links and images
  // are flattened to plain text so nothing in the output is clickable.
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function inline(t) {
    var codes = [];
    t = t.replace(/`([^`\n]+)`/g, function (_, c) { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    t = esc(t);
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]*)[^)]*\)/g, '$1');
    t = t.replace(/\[([^\]]+)\]\(([^)\s]*)[^)]*\)/g, '$1 ($2)');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
    t = t.replace(/\u0000(\d+)\u0000/g, function (_, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
    return t;
  }
  function md(src) {
    var lines = String(src).replace(/\r\n?/g, '\n').split('\n'), out = [], i = 0, para = [];
    function flush() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^```/.test(l)) {
        flush(); var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
      }
      if (!l.trim()) { flush(); i++; continue; }
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); var n = Math.min(m[1].length, 4); out.push('<h' + n + '>' + inline(m[2]) + '</h' + n + '>'); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push('<hr>'); i++; continue; }
      if (/^>\s?/.test(l)) {
        flush(); var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        out.push('<blockquote>' + inline(q.join(' ')) + '</blockquote>'); continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
        flush(); var ord = /^\s*\d/.test(l), items = [];
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) items.push('<li>' + inline(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '')) + '</li>');
        out.push((ord ? '<ol>' : '<ul>') + items.join('') + (ord ? '</ol>' : '</ul>')); continue;
      }
      para.push(l.trim()); i++;
    }
    flush();
    return out.join('');
  }

  // ── UI
  function showOutput(id) {
    viewing = id;
    var it = find(load(), id), box = $('out');
    $('reply').style.display = it && it.status === 'done' ? 'block' : 'none';
    if (!it) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    if (it.status === 'done' && it.result) box.innerHTML = md(it.result);
    else if (it.status === 'timeout') box.innerHTML = '<p class="hint">No response came back.</p>';
    else if (it.status === 'failed') box.innerHTML = '<p class="hint">' + esc(it.error || 'Failed.') + '</p>';
    else box.innerHTML = '<p class="hint">Working on it…</p>';
  }

  function statusLabel(it) {
    return it.status === 'done' ? 'done' : it.status === 'timeout' ? 'no response' : it.status === 'failed' ? 'failed' : 'working…';
  }

  function render() {
    var box = $('history');
    box.textContent = '';
    var list = load();
    if (!list.length) { box.innerHTML = '<div class="hint">Nothing sent yet.</div>'; return; }
    list.forEach(function (it) {
      var d = document.createElement('div'); d.className = 'item';
      var p = document.createElement('div'); p.className = 'p'; p.textContent = it.prompt;
      var m = document.createElement('div'); m.className = 'm';
      var t = document.createElement('span'); t.textContent = new Date(it.at).toLocaleString();
      var st = document.createElement('span'); st.className = 'st'; st.textContent = statusLabel(it);
      m.appendChild(t); m.appendChild(st);
      if (it.parent) { var rp = document.createElement('span'); rp.textContent = 'reply'; m.appendChild(rp); }
      var v = document.createElement('button'); v.textContent = 'View';
      v.onclick = function () { showOutput(it.id); $('out').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
      var b = document.createElement('button'); b.textContent = 'Reuse';
      b.onclick = function () { $('prompt').value = it.prompt; $('prompt').focus(); };
      m.appendChild(v); m.appendChild(b);
      d.appendChild(p); d.appendChild(m); box.appendChild(d);
    });
  }

  function refresh(id) { render(); if (viewing === id) showOutput(id); }

  function syncKey() { return localStorage.getItem('verdict-cat-sync-key') || ''; }

  function poll(id) {
    if (pollers[id]) return;
    pollers[id] = setInterval(async function () {
      var it = find(load(), id);
      if (!it || it.status !== 'running') { clearInterval(pollers[id]); delete pollers[id]; return; }
      if (Date.now() - it.at > GIVE_UP_MS) { update(id, { status: 'timeout' }); clearInterval(pollers[id]); delete pollers[id]; refresh(id); return; }
      try {
        var r = await fetch(WORKER + '/clyde/run/' + encodeURIComponent(id), { headers: { 'Authorization': 'Bearer ' + syncKey() } });
        if (r.status === 404) { update(id, { status: 'failed', error: 'Run not found.' }); clearInterval(pollers[id]); delete pollers[id]; refresh(id); return; }
        if (!r.ok) return;
        var d = await r.json();
        if (d.status !== 'running') {
          update(id, { status: d.status, result: d.result || '' });
          clearInterval(pollers[id]); delete pollers[id]; refresh(id);
        }
      } catch (e) {}
    }, POLL_MS);
  }

  async function run(parentId) {
    var isReply = typeof parentId === 'string';
    var field = isReply ? $('replyText') : $('prompt');
    var prompt = field.value.trim();
    if (!prompt) { setMsg(isReply ? 'Write your reply first.' : 'Write a prompt first.', 'err'); return; }
    if (!syncKey()) { setMsg('No sync key on this device. Set it from the hub (Sync Key).', 'err'); return; }
    $('run').disabled = true; $('replyBtn').disabled = true; setMsg('Sending…');
    try {
      var resp = await fetch(WORKER + '/clyde/run', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + syncKey(), 'Content-Type': 'application/json' },
        body: JSON.stringify(isReply ? { prompt: prompt, parent: parentId } : { prompt: prompt })
      });
      var data = {};
      try { data = await resp.json(); } catch (e) {}
      if (!resp.ok || !data.id) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
      var list = load();
      list.unshift({ id: data.id, prompt: prompt, at: Date.now(), status: 'running', parent: isReply ? parentId : undefined });
      save(list);
      field.value = '';
      setMsg('Sent.', 'ok');
      viewing = data.id; render(); showOutput(data.id); poll(data.id);
    } catch (e) {
      setMsg(e.message || 'Failed to send.', 'err');
    } finally {
      $('run').disabled = false; $('replyBtn').disabled = false;
    }
  }

  $('run').onclick = function () { run(); };
  $('replyBtn').onclick = function () { if (viewing) run(viewing); };
  $('prompt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });
  $('replyText').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (viewing) run(viewing); }
  });
  render();
  load().forEach(function (it) { if (it.id && it.status === 'running') poll(it.id); });
  var first = load()[0]; if (first && first.id) showOutput(first.id);
</script>
</body>
</html>
