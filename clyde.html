<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clyde</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<script>if (localStorage.getItem('hub_auth') !== '1') location.replace('index.html');</script>
<script src="gist.js?v=4"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d23; --border: #2e3238; --text: #e8eaed;
    --muted: #8b9099; --accent: #5b9bd5; --ok: #5bb98b; --danger: #d94f4f; --bar-h: 52px;
  }
  html, body {
    min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  #topbar {
    position: sticky; top: 0; height: var(--bar-h); background: var(--surface);
    border-bottom: 1px solid var(--border); display: flex; align-items: center;
    padding: 0 20px; gap: 16px; z-index: 100;
  }
  #topbar a { color: var(--muted); text-decoration: none; font-size: 13px; }
  #topbar a:hover { color: var(--accent); }
  #topbar h1 { font-size: 15px; font-weight: 600; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 180px; resize: vertical; background: var(--surface);
    color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 12px; color: var(--muted); }
  #msg { font-size: 13px; min-height: 1.4em; }
  #msg.ok { color: var(--ok); } #msg.err { color: var(--danger); }
  #msg a { color: inherit; }
  h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 32px 0 10px; text-transform: uppercase; letter-spacing: .05em; }
  .item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .item .p { white-space: pre-wrap; word-break: break-word; font-size: 13px; max-height: 5.5em; overflow: hidden; }
  .item .m { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .item .m a { color: var(--accent); }
  .item .m button { background: none; color: var(--accent); padding: 0; font-size: 11px; font-weight: 400; }
</style>
</head>
<body>
<div id="topbar">
  <a href="index.html">&#8592; Hub</a>
  <h1>Clyde</h1>
</div>
<main>
  <label for="prompt">Prompt for Claude Code</label>
  <textarea id="prompt" placeholder="What should Claude Code do?"></textarea>
  <div class="row">
    <button id="run">Run in Claude Code</button>
    <span class="hint">Ctrl/&#8984;+Enter to send</span>
  </div>
  <div class="row"><div id="msg"></div></div>
  <h2>Recent</h2>
  <div id="history"></div>
</main>
<script>
  var KEY = 'clyde-history';
  var WORKER = 'https://verdict-cat-sync.saeed-a-alzeera.workers.dev';
  var $ = function (id) { return document.getElementById(id); };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list.slice(0, 30))); } catch (e) {} }

  function setMsg(text, cls, link) {
    var m = $('msg');
    m.className = cls || '';
    m.textContent = text;
    if (link) {
      m.appendChild(document.createTextNode(' '));
      var a = document.createElement('a');
      a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open session';
      m.appendChild(a);
    }
  }

  function render() {
    var box = $('history');
    box.textContent = '';
    var list = load();
    if (!list.length) { box.innerHTML = '<div class="hint">Nothing sent yet.</div>'; return; }
    list.forEach(function (it) {
      var d = document.createElement('div'); d.className = 'item';
      var p = document.createElement('div'); p.className = 'p'; p.textContent = it.prompt;
      var m = document.createElement('div'); m.className = 'm';
      var t = document.createElement('span'); t.textContent = new Date(it.at).toLocaleString();
      m.appendChild(t);
      if (it.url && /^https:\/\/claude\.ai\//.test(it.url)) {
        var a = document.createElement('a'); a.href = it.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Open session';
        m.appendChild(a);
      }
      var b = document.createElement('button'); b.textContent = 'Reuse';
      b.onclick = function () { $('prompt').value = it.prompt; $('prompt').focus(); };
      m.appendChild(b);
      d.appendChild(p); d.appendChild(m); box.appendChild(d);
    });
  }

  async function run() {
    var prompt = $('prompt').value.trim();
    if (!prompt) { setMsg('Write a prompt first.', 'err'); return; }
    var key = localStorage.getItem('verdict-cat-sync-key');
    if (!key) { setMsg('No sync key on this device. Set it from the hub (Sync Key).', 'err'); return; }
    $('run').disabled = true; setMsg('Sending…');
    try {
      var resp = await fetch(WORKER + '/clyde/run', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt })
      });
      var data = {};
      try { data = await resp.json(); } catch (e) {}
      if (!resp.ok) throw new Error(data.error || ('Request failed (' + resp.status + ')'));
      var list = load();
      list.unshift({ prompt: prompt, at: Date.now(), url: data.sessionUrl || '' });
      save(list);
      $('prompt').value = '';
      render();
      setMsg('Sent. Claude Code is working on it.', 'ok', data.sessionUrl && /^https:\/\/claude\.ai\//.test(data.sessionUrl) ? data.sessionUrl : '');
    } catch (e) {
      setMsg(e.message || 'Failed to send.', 'err');
    } finally {
      $('run').disabled = false;
    }
  }

  $('run').onclick = run;
  $('prompt').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });
  render();
</script>
</body>
</html>
