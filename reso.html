<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reso</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="stylesheet" href="site.css" />
<script src="site.js"></script>
<style>
  :root { --bg:#0f1117; --panel:#1a1d23; --line:#2e3238; --ink:#e8eaed; --muted:#8b9099; --accent:#5b9bd5; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
     line-height:1.45; min-height:100vh; }
  body { font-size: 0.9375rem; }
  #back { position:fixed; top:0; left:0; padding:16px 20px; color:var(--muted); text-decoration:none; font-size:0.8125rem; }
  #back:hover { color:var(--accent); }
  main { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
  h1 { font-size:1.25rem; font-weight:600; margin:0 0 6px; letter-spacing:-0.02em; }
  .sub { font-size:0.8125rem; color:var(--muted); margin:0 0 36px; }
  .hub-cards { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; width:100%; max-width:680px; }
</style>
</head>
<body>
<a id="back" href="index.html">&#8592; Hub</a>
<main>
  <h1>Reso</h1>
  <p class="sub">Choose a section</p>
  <div class="hub-cards">
    <a class="hub-card" href="texas.html">
      <div class="icon">🃏</div><div class="label">Texas</div><div class="desc">Due-diligence profiles</div>
    </a>
    <a class="hub-card" href="financials.html">
      <div class="icon">📈</div><div class="label">SEC Financials</div><div class="desc">Build tables from filings</div>
    </a>
    <a class="hub-card" href="numbers.html">
      <div class="icon">📊</div><div class="label">Numbers</div><div class="desc">Economic &amp; demographic data</div>
    </a>
  </div>
</main>
<script>
  if (localStorage.getItem('hub_auth') !== '1') location.replace('index.html');
</script>
</body>
</html>
