<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Wordgrid Online</title>
<link rel="stylesheet" href="wordgrid.css"/>
<style>
.card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; margin-top: 24px; }
.card h2 { font-size: 18px; margin-bottom: 4px; }
.card p.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.card label.f { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
.card input[type=text], .card input[type=password] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; color: var(--ink); font: inherit; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.icons button { aspect-ratio: 1; font-size: 20px; line-height: 1; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); cursor: pointer; }
.icons button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); outline: 2px solid var(--accent); }
.err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
.seats { display: grid; gap: 8px; margin: 10px 0 16px; }
.seatrow { display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-left: 4px solid var(--pc); border-radius: 8px; padding: 8px 12px; }
.seatrow.empty { border-left-color: var(--border2); color: var(--muted); border-style: dashed; }
.seatrow .ic { font-size: 22px; width: 28px; text-align: center; }
.seatrow .nm { flex: 1; font-weight: 600; }
.seatrow .tag { font-size: 11px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--ok); }
.invite { display: flex; gap: 8px; margin: 8px 0 4px; }
.invite input { flex: 1; font-size: 12px; }
.pcard .ic { margin-right: 4px; }
.pcard .nm .away { color: var(--faint); }
#conn { font-size: 11px; color: var(--muted); }
#conn.bad { color: var(--danger); }
.screen { display: none; width: 100%; flex-direction: column; align-items: center; }
.screen.on { display: flex; }
#game.on { display: flex; max-width: 640px; gap: 10px; align-items: stretch; }
.yourturn { color: var(--ok); font-weight: 700; }
</style>
</head>
<body>

<header>
  <a href="index.html">← Local game</a>
  <h1>Wordgrid Online</h1>
  <span id="conn"></span>
</header>

<!-- create a room -->
<section class="screen" id="home"><div class="card">
  <h2>Create a room</h2>
  <p class="sub">You get an invite link to send. Friends need no key.</p>
  <label class="f" for="gameKey">Game key <span style="opacity:.7">(not your sync key)</span></label>
  <input type="password" id="gameKey" autocomplete="off" placeholder="paste once, remembered on this device"/>
  <label class="f">Seats</label>
  <div class="seg" id="seatSeg">
    <button data-n="2">2</button><button data-n="3">3</button><button data-n="4" class="on">4</button>
  </div>
  <label class="f" for="hName">Your name</label>
  <input type="text" id="hName" maxlength="14" autocomplete="nickname"/>
  <label class="f">Your icon</label>
  <div class="icons" id="hIcons"></div>
  <div class="hint" id="hPrefill"></div>
  <button class="btn primary" id="createBtn" style="width:100%;margin-top:18px">Create room</button>
  <div class="err" id="homeErr"></div>
</div></section>

<!-- joining by invite -->
<section class="screen" id="join"><div class="card">
  <h2>You're invited to a game</h2>
  <p class="sub">Pick how you'll appear to the other players.</p>
  <label class="f" for="jName">Your name</label>
  <input type="text" id="jName" maxlength="14" autocomplete="nickname"/>
  <label class="f">Your icon</label>
  <div class="icons" id="jIcons"></div>
  <div class="hint" id="jPrefill"></div>
  <button class="btn primary" id="joinBtn" style="width:100%;margin-top:18px">Join game</button>
  <div class="err" id="joinErr"></div>
</div></section>

<!-- lobby -->
<section class="screen" id="lobby"><div class="card">
  <h2>Waiting room</h2>
  <p class="sub" id="lobbySub"></p>
  <div class="seats" id="seatList"></div>
  <div id="inviteBox" style="display:none">
    <label class="f" style="margin-top:0">Invite link — send this to your friends</label>
    <div class="invite"><input type="text" id="inviteUrl" readonly/><button class="btn" id="copyBtn">Copy</button><button class="btn" id="shareBtn" style="display:none">Share</button></div>
  </div>
  <button class="btn primary" id="startBtn" style="width:100%;margin-top:14px;display:none">Start game</button>
  <div class="hint" id="lobbyHint"></div>
  <div class="err" id="lobbyErr"></div>
</div></section>

<!-- game -->
<section class="screen" id="game">
  <div id="scores"></div>
  <div id="meta"><span id="bagInfo"></span><span id="turnInfo"></span></div>
  <div id="board-wrap"><div id="board"></div></div>
  <div id="status"></div>
  <div id="rack"></div>
  <div id="actions">
    <button class="btn primary" id="playBtn">Play</button>
    <button class="btn" id="recallBtn">Recall</button>
    <button class="btn" id="swapBtn">Swap</button>
    <button class="btn" id="passBtn">Pass</button>
    <button class="btn danger" id="resignBtn">Resign</button>
  </div>
  <div id="log"></div>
</section>

<!-- message / dead end -->
<section class="screen" id="dead"><div class="card"><h2 id="deadTitle"></h2><p class="sub" id="deadMsg"></p><a class="btn" href="online.html" style="display:inline-block;text-decoration:none">Start over</a></div></section>

<div class="overlay" id="blankPick"><div class="modal"><h3>Blank tile</h3><p>Choose the letter it stands for.</p><div class="letters" id="letters"></div></div></div>
<div class="overlay" id="endModal"><div class="modal"><h3 id="endTitle">Game over</h3><p id="endSub"></p><table class="st" id="endTable"></table><button class="btn primary" id="rematchBtn">Rematch</button><p id="endWait" style="margin:10px 0 0"></p></div></div>

<script src="engine.js"></script>
<script src="icons.js"></script>
<script>
(function () {
  'use strict';
  var E = window.WordgridEngine, ICONS = window.WordgridIcons;
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['var(--p0)', 'var(--p1)', 'var(--p2)', 'var(--p3)'];

  // ---- storage (every access guarded: private windows can throw) ----
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function lsGetJson(k) { try { return JSON.parse(lsGet(k)); } catch (e) { return null; } }
  var LS_KEY = 'wordgrid_key', LS_PROFILE = 'wordgrid_profile', seatKey = function (id) { return 'wordgrid_room_' + id; };

  var WORKER = lsGet('wordgrid_worker') || 'https://verdict-cat-wordgrid.saeed-a-alzeera.workers.dev';
  function wsUrl(path) { return WORKER.replace(/^http/, 'ws') + path; }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function show(id) {
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function (s) { s.classList.toggle('on', s.id === id); });
  }
  function dead(title, msg) { $('deadTitle').textContent = title; $('deadMsg').textContent = msg; show('dead'); }

  // ---- profile: remembered, but only ever used to PREFILL ----
  function profile() { var p = lsGetJson(LS_PROFILE); return p && typeof p === 'object' ? p : null; }
  function makePicker(boxId, nameId, hintId) {
    var p = profile(), chosen = (p && ICONS.indexOf(p.icon) >= 0) ? p.icon : ICONS[Math.floor(Math.random() * ICONS.length)];
    var box = $(boxId);
    function paint() {
      Array.prototype.forEach.call(box.children, function (b) { b.classList.toggle('on', b.dataset.icon === chosen); });
    }
    ICONS.forEach(function (ic) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = ic; b.dataset.icon = ic; b.setAttribute('aria-label', 'Icon ' + ic);
      b.addEventListener('click', function () { chosen = ic; paint(); });
      box.appendChild(b);
    });
    paint();
    if (p && p.name) {
      $(nameId).value = p.name;
      $(hintId).textContent = 'Prefilled from your last game — change it if you want to appear differently.';
    }
    return { name: function () { return $(nameId).value.trim(); }, icon: function () { return chosen; } };
  }

  // ---- routing ----
  var hash = new URLSearchParams(location.hash.slice(1));
  var roomId = hash.get('room') || hash.get('r') || '', invite = hash.get('i') || '';
  var validId = /^[a-f0-9]{24}$/.test(roomId);

  // ---- create ----
  var homePicker = null, joinPicker = null, seats = 4;
  function initHome() {
    show('home');
    homePicker = makePicker('hIcons', 'hName', 'hPrefill');
    $('gameKey').value = lsGet(LS_KEY) || '';
    $('seatSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      seats = +b.dataset.n;
      Array.prototype.forEach.call($('seatSeg').children, function (x) { x.classList.toggle('on', x === b); });
    });
    $('createBtn').addEventListener('click', createRoom);
  }
  function createRoom() {
    var key = $('gameKey').value.trim();
    if (!key) { $('homeErr').textContent = 'Enter your game key.'; return; }
    $('homeErr').textContent = ''; $('createBtn').disabled = true;
    fetch(WORKER + '/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify({ seats: seats, name: homePicker.name(), icon: homePicker.icon() })
    }).then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) {
        if (x.r.status === 401) throw new Error('That key isn’t right.');
        if (!x.r.ok) throw new Error(x.j.error || 'Could not create the room.');
        lsSet(LS_KEY, key);
        enterRoom(x.j.roomId, { token: x.j.token, seat: x.j.seat, invite: x.j.invite }, { name: x.j.name, icon: x.j.icon });
      })
      .catch(function (e) { $('homeErr').textContent = e.message === 'Failed to fetch' ? 'Could not reach the game server.' : e.message; })
      .then(function () { $('createBtn').disabled = false; });
  }

  // ---- join by invite ----
  function initJoin() {
    show('join');
    joinPicker = makePicker('jIcons', 'jName', 'jPrefill');
    $('joinBtn').addEventListener('click', function () {
      $('joinErr').textContent = ''; $('joinBtn').disabled = true;
      var saved = lsGetJson(seatKey(roomId));
      var body = { name: joinPicker.name(), icon: joinPicker.icon() };
      if (saved && saved.token) body.token = saved.token;
      body.invite = invite;
      fetch(WORKER + '/r/' + roomId + '/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
        .then(function (x) {
          if (!x.r.ok) throw new Error(x.j.error || 'Could not join.');
          enterRoom(roomId, { token: x.j.token, seat: x.j.seat, invite: (saved && saved.invite) || '' }, { name: x.j.name, icon: x.j.icon });
        })
        .catch(function (e) { $('joinErr').textContent = e.message === 'Failed to fetch' ? 'Could not reach the game server.' : e.message; })
        .then(function () { $('joinBtn').disabled = false; });
    });
  }

  // ---- in a room ----
  var me = null, ws = null, retry = 0, gotState = false, closedByUs = false, pingTimer = null, S = null;

  function enterRoom(id, seatInfo, prof) {
    roomId = id; me = seatInfo;
    lsSet(seatKey(id), JSON.stringify(seatInfo));
    if (prof) lsSet(LS_PROFILE, JSON.stringify({ name: prof.name, icon: prof.icon }));
    try { history.replaceState(null, '', location.pathname + '#room=' + id); } catch (e) { /* ignore */ }
    connect();
  }

  function setConn(text, bad) { var c = $('conn'); c.textContent = text; c.className = bad ? 'bad' : ''; }

  function connect() {
    closedByUs = false;
    setConn('Connecting…');
    ws = new WebSocket(wsUrl('/r/' + roomId + '/ws?t=' + encodeURIComponent(me.token)));
    ws.onopen = function () {
      retry = 0; setConn('');
      clearInterval(pingTimer); pingTimer = setInterval(function () { send({ type: 'ping' }); }, 40000);
    };
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'state') { gotState = true; onState(m); }
      else if (m.type === 'error') flash(m.message);
    };
    ws.onclose = function () {
      clearInterval(pingTimer);
      if (closedByUs) return;
      retry++;
      if (!gotState && retry >= 3) {
        try { localStorage.removeItem(seatKey(roomId)); } catch (e) { /* ignore */ }
        return dead('Can’t open this room', 'Your seat wasn’t recognised, or the room has expired. Ask the host for a fresh invite link.');
      }
      setConn('Reconnecting…', true);
      setTimeout(connect, Math.min(10000, 800 * Math.pow(2, retry - 1)));
    };
  }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function flash(msg) {
    var el = S && S.phase !== 'lobby' ? $('status') : $('lobbyErr');
    el.textContent = msg; el.className = S && S.phase !== 'lobby' ? 'bad' : 'err';
  }

  // ---- state -> UI ----
  var lastSig = '', pending = [], selected = -1, swapMode = false, swapSel = [], dict = null;
  fetch('enable.txt').then(function (r) { return r.ok ? r.text() : Promise.reject(); }).then(function (t) {
    dict = new Set(t.split('\n').map(function (s) { return s.trim(); }).filter(Boolean)); if (S && S.game) render();
  }).catch(function () { /* the server checks words anyway */ });
  var isWord = function (w) { return dict ? dict.has(w) : true; };

  function onState(s) {
    S = s;
    if (s.phase === 'lobby') { renderLobby(); show('lobby'); return; }
    var sig = s.game.turn + ':' + s.game.history.length + ':' + s.phase;
    if (sig !== lastSig) { lastSig = sig; pending = []; selected = -1; swapMode = false; swapSel = []; $('status').className = ''; }
    show('game'); render();
    $('endModal').classList.toggle('on', s.phase === 'over');
    if (s.phase === 'over') renderEnd();
    var mine = s.phase === 'playing' && s.game.turn === s.you;
    document.title = (mine ? '● Your turn — ' : '') + 'Wordgrid Online';
  }

  function seatMeta(i) { return S.seats[i] || { name: '?', icon: '' }; }

  function renderLobby() {
    var s = S, host = s.you === 0;
    $('lobbySub').textContent = host ? 'Send the invite link, then start when everyone is in.' : 'Waiting for the host to start the game.';
    var list = $('seatList'); list.innerHTML = '';
    for (var i = 0; i < s.maxSeats; i++) {
      var d = document.createElement('div'), p = s.seats[i];
      d.className = 'seatrow' + (p ? '' : ' empty'); d.style.setProperty('--pc', COLORS[i]);
      if (p) {
        var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = p.icon;
        var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name + (p.seat === s.you ? ' (you)' : '');
        var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = p.seat === 0 ? 'host' : '';
        var dt = document.createElement('span'); dt.className = 'dot' + (p.connected ? ' on' : ''); dt.title = p.connected ? 'online' : 'offline';
        d.appendChild(ic); d.appendChild(nm); d.appendChild(tg); d.appendChild(dt);
      } else {
        var w = document.createElement('span'); w.className = 'nm'; w.textContent = 'Waiting for player…'; d.appendChild(w);
      }
      list.appendChild(d);
    }
    var inv = s.invite || me.invite;
    $('inviteBox').style.display = host && inv ? 'block' : 'none';
    if (host && inv) {
      $('inviteUrl').value = location.origin + location.pathname + '#r=' + roomId + '&i=' + inv;
      $('shareBtn').style.display = navigator.share ? '' : 'none';
    }
    $('startBtn').style.display = host ? 'block' : 'none';
    $('startBtn').disabled = s.seats.length < 2;
    $('lobbyHint').textContent = host ? (s.seats.length < 2 ? 'You need at least one more player.' : s.seats.length + ' players ready. You can start now or wait for more.') : '';
    $('lobbyErr').textContent = '';
  }
  $('copyBtn').addEventListener('click', function () {
    var u = $('inviteUrl'); u.select();
    (navigator.clipboard ? navigator.clipboard.writeText(u.value) : Promise.reject()).catch(function () { document.execCommand('copy'); })
      .then(function () { $('copyBtn').textContent = 'Copied'; setTimeout(function () { $('copyBtn').textContent = 'Copy'; }, 1500); });
  });
  $('shareBtn').addEventListener('click', function () { navigator.share({ title: 'Wordgrid', text: 'Join my word game', url: $('inviteUrl').value }).catch(function () {}); });
  $('startBtn').addEventListener('click', function () { send({ type: 'start' }); });

  // board
  var boardBuilt = false;
  function buildBoard() {
    var b = $('board'); b.innerHTML = '';
    for (var r = 0; r < E.SIZE; r++) for (var c = 0; c < E.SIZE; c++) {
      var d = document.createElement('div'); d.className = 'sq ' + E.PREMIUM[r][c]; d.dataset.r = r; d.dataset.c = c; b.appendChild(d);
    }
    boardBuilt = true;
  }
  function cellEl(r, c) { return $('board').children[r * E.SIZE + c]; }
  function tileNode(ch, blank, cls) {
    var t = document.createElement('div'); t.className = 'tile' + (blank ? ' blank' : '') + (cls ? ' ' + cls : '');
    t.textContent = ch;
    if (!blank) { var s = document.createElement('sub'); s.textContent = E.VALUE[ch]; t.appendChild(s); }
    return t;
  }
  function lastPlay() {
    var h = S.game.history;
    for (var i = h.length - 1; i >= 0; i--) if (h[i].type === 'play') return h[i];
    return null;
  }
  function toPlacements() { return pending.map(function (p) { return { r: p.r, c: p.c, ch: p.ch, blank: p.blank }; }); }

  function render() {
    if (!boardBuilt) buildBoard();
    var g = S.game, mineTurn = S.phase === 'playing' && g.turn === S.you;

    var sc = $('scores'); sc.innerHTML = '';
    g.players.forEach(function (p, i) {
      var m = seatMeta(i), d = document.createElement('div');
      d.className = 'pcard' + (i === g.turn && !g.over ? ' turn' : '') + (p.resigned ? ' out' : '');
      d.style.setProperty('--pc', COLORS[i]);
      var nm = document.createElement('div'); nm.className = 'nm';
      var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = m.icon;
      var tx = document.createElement('span'); tx.textContent = p.name + (i === S.you ? ' (you)' : '');
      if (!m.connected && !p.resigned) tx.className = 'away';
      nm.appendChild(ic); nm.appendChild(tx);
      var s = document.createElement('div'); s.className = 'sc'; s.textContent = p.score;
      d.appendChild(nm); d.appendChild(s);
      if (p.resigned) { var t = document.createElement('div'); t.className = 'tag'; t.textContent = 'resigned'; d.appendChild(t); }
      else if (!m.connected) { var o = document.createElement('div'); o.className = 'tag'; o.textContent = 'offline'; d.appendChild(o); }
      sc.appendChild(d);
    });
    $('bagInfo').textContent = 'Bag: ' + g.bagCount + ' tiles';
    var ti = $('turnInfo'); ti.className = mineTurn ? 'yourturn' : '';
    ti.textContent = g.over ? 'Game over' : (mineTurn ? 'Your turn' : seatMeta(g.turn).name + ' to play');

    var lp = lastPlay();
    for (var r = 0; r < E.SIZE; r++) for (var c = 0; c < E.SIZE; c++) {
      var el = cellEl(r, c); el.textContent = '';
      var t = g.board[r][c], pend = pending.filter(function (p) { return p.r === r && p.c === c; })[0];
      if (t) {
        var isLast = lp && lp.cells.some(function (x) { return x[0] === r && x[1] === c; });
        var n = tileNode(t.ch, t.blank, isLast ? 'last' : '');
        if (isLast) n.style.setProperty('--pc', COLORS[lp.player]);
        el.appendChild(n);
      } else if (pend) el.appendChild(tileNode(pend.ch, pend.blank, 'pending'));
      else el.textContent = (r === E.CENTER && c === E.CENTER) ? '★' : E.PREMIUM[r][c];
    }

    var rk = $('rack'); rk.innerHTML = '';
    var usedIdx = pending.map(function (p) { return p.rackIdx; });
    g.rack.forEach(function (ch, i) {
      var b = document.createElement('button');
      b.className = 'rt' + (ch === '?' ? ' blankt' : '') + (usedIdx.indexOf(i) >= 0 ? ' used' : '') +
        (!swapMode && selected === i ? ' sel' : '') + (swapMode && swapSel.indexOf(i) >= 0 ? ' swap' : '');
      b.textContent = ch === '?' ? ' ' : ch;
      if (ch !== '?') { var s = document.createElement('sub'); s.textContent = E.VALUE[ch]; b.appendChild(s); }
      b.dataset.i = i; rk.appendChild(b);
    });

    var live = S.phase === 'playing';
    $('playBtn').disabled = !mineTurn || !pending.length || swapMode;
    $('recallBtn').disabled = !pending.length;
    $('swapBtn').disabled = !mineTurn || pending.length > 0;
    $('swapBtn').textContent = swapMode ? (swapSel.length ? 'Confirm swap (' + swapSel.length + ')' : 'Cancel swap') : 'Swap';
    $('passBtn').disabled = !mineTurn || swapMode;
    $('resignBtn').disabled = !live || g.players[S.you].resigned;

    var st = $('status');
    if (mineTurn && pending.length && !swapMode) {
      var gg = { board: g.board, history: g.board[E.CENTER][E.CENTER] ? [{ type: 'play' }] : [] };
      var ev = E.evaluate(gg, toPlacements(), isWord);
      if (ev.ok) { st.className = 'good'; st.textContent = ev.words.map(function (w) { return w.word + ' ' + w.score; }).join(' · ') + (ev.bingo ? ' · +50 bingo' : '') + '  =  ' + ev.score + ' pts'; }
      else { st.className = pending.length < 2 && !g.board[E.CENTER][E.CENTER] ? '' : 'bad'; st.textContent = ev.error; }
    } else if (swapMode) { st.className = ''; st.textContent = 'Tap the tiles to exchange, then confirm.'; }
    else if (!st.classList.contains('bad') || mineTurn) {
      st.className = ''; st.textContent = g.over ? '' : (mineTurn ? 'Your turn — pick a tile, then tap a square.' : 'Waiting for ' + seatMeta(g.turn).name + '…');
    }

    var lg = $('log'); lg.innerHTML = '';
    g.history.slice(-8).reverse().forEach(function (h) {
      var d = document.createElement('div'), who = seatMeta(h.player).name, txt;
      if (h.type === 'play') txt = 'played ' + h.words.map(function (w) { return w.word + ' (' + w.score + ')'; }).join(', ') + (h.bingo ? ' +50 bingo' : '') + ' for ' + h.score + '.';
      else if (h.type === 'pass') txt = 'passed.'; else if (h.type === 'swap') txt = 'swapped ' + h.count + '.'; else txt = 'resigned.';
      var b = document.createElement('b'); b.textContent = who; d.appendChild(b); d.appendChild(document.createTextNode(' ' + txt)); lg.appendChild(d);
    });
  }

  function renderEnd() {
    var g = S.game, st = g.standings, top = st.filter(function (x) { return x.rank === 1; });
    var reasons = { out: 'A player used their last tile — remaining racks are scored.', stalled: 'Everyone passed twice in a row.', resigned: 'Only one player is left.' };
    $('endTitle').textContent = top.length > 1 ? 'Tie: ' + top.map(function (x) { return x.name; }).join(' & ') : top[0].name + ' wins!';
    $('endSub').textContent = reasons[g.endReason] || '';
    var tb = $('endTable'); tb.innerHTML = '';
    st.forEach(function (x) {
      var tr = document.createElement('tr'), a = document.createElement('td'), b = document.createElement('td');
      a.textContent = (x.rank ? x.rank + '. ' : '— ') + seatMeta(x.index).icon + ' ' + x.name + (x.resigned ? ' (resigned)' : '');
      b.textContent = x.score; tr.appendChild(a); tr.appendChild(b); tb.appendChild(tr);
    });
    $('rematchBtn').style.display = S.you === 0 ? '' : 'none';
    $('endWait').textContent = S.you === 0 ? '' : 'Waiting for the host to start a rematch…';
  }
  $('rematchBtn').addEventListener('click', function () { send({ type: 'rematch' }); });

  // ---- input ----
  $('rack').addEventListener('click', function (e) {
    var b = e.target.closest('.rt'); if (!b || b.classList.contains('used')) return;
    var i = +b.dataset.i;
    if (swapMode) { var k = swapSel.indexOf(i); if (k >= 0) swapSel.splice(k, 1); else swapSel.push(i); }
    else selected = selected === i ? -1 : i;
    render();
  });
  $('board').addEventListener('click', function (e) {
    var sq = e.target.closest('.sq'); if (!sq || !S || S.phase !== 'playing' || swapMode || S.game.turn !== S.you) return;
    var r = +sq.dataset.r, c = +sq.dataset.c;
    var pi = pending.findIndex(function (p) { return p.r === r && p.c === c; });
    if (pi >= 0) { pending.splice(pi, 1); render(); return; }
    if (S.game.board[r][c]) return;
    if (selected < 0) { $('status').className = ''; $('status').textContent = 'Pick a tile from your rack first.'; return; }
    var ch = S.game.rack[selected], idx = selected;
    if (ch === '?') pickBlank(function (L) { pending.push({ r: r, c: c, ch: L, blank: true, rackIdx: idx }); selected = -1; render(); });
    else { pending.push({ r: r, c: c, ch: ch, blank: false, rackIdx: idx }); selected = -1; render(); }
  });
  function pickBlank(cb) {
    var box = $('letters'); box.innerHTML = '';
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function (L) {
      var b = document.createElement('button'); b.textContent = L;
      b.addEventListener('click', function () { $('blankPick').classList.remove('on'); cb(L); }); box.appendChild(b);
    });
    $('blankPick').classList.add('on');
  }
  $('blankPick').addEventListener('click', function (e) { if (e.target === this) { this.classList.remove('on'); selected = -1; render(); } });
  $('recallBtn').addEventListener('click', function () { pending = []; selected = -1; render(); });
  $('playBtn').addEventListener('click', function () { send({ type: 'play', placements: toPlacements() }); $('playBtn').disabled = true; });
  $('passBtn').addEventListener('click', function () { send({ type: 'pass' }); });
  $('swapBtn').addEventListener('click', function () {
    if (!swapMode) {
      if (S.game.bagCount < E.RACK) { flash('Fewer than ' + E.RACK + ' tiles left in the bag — swapping is closed.'); return; }
      swapMode = true; swapSel = []; selected = -1; render(); return;
    }
    if (!swapSel.length) { swapMode = false; render(); return; }
    send({ type: 'swap', indices: swapSel });
  });
  $('resignBtn').addEventListener('click', function () { if (confirm('Resign? Your tiles go back in the bag.')) send({ type: 'resign' }); });

  // ---- boot ----
  var saved = validId ? lsGetJson(seatKey(roomId)) : null;
  if (validId && saved && saved.token && !invite) {
    me = saved; connect();                                   // resume own seat (#room=…)
  } else if (validId && invite) {
    initJoin();                                              // invite link: ask who they are, prefilled
  } else if (validId) {
    dead('No seat in this room', 'Open the invite link the host sent you.');
  } else {
    initHome();
  }
})();
</script>
</body>
</html>
