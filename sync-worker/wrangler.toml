name = "verdict-cat-sync"
main = "worker.js"
compatibility_date = "2024-09-23"

# Sync state (reading progress, regions, snippets), the book catalogue and the
# uploaded epub/cover files all live in a SQLite-backed Durable Object:
# strongly consistent, free-plan friendly, and it needs no database or bucket
# id to be filled in before the first deploy.
[[durable_objects.bindings]]
name = "STORE"
class_name = "SyncStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MPRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["MPRoom"]  # Spell Architect co-op signaling moved to its own repo/worker

# Required secret (not stored here):  wrangler secret put SYNC_KEY
