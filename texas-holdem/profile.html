<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — Texas Hold 'Em</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../favicon-180.png" />
<link rel="shortcut icon" href="../favicon.ico" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d23;
    --border: #2e3238;
    --text: #e8eaed;
    --muted: #8b9099;
    --accent: #5b9bd5;
  }

  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  header {
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header a { color: var(--muted); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--text); }
  header .title { font-size: 15px; font-weight: 600; flex: 1; }

  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

  pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-x: auto;
  }

  .status { color: var(--muted); font-size: 14px; padding: 8px 0 20px; }
</style>
</head>
<body>

<header>
  <a href="../texas-holdem.html">&larr; Texas Hold 'Em</a>
  <div class="title" id="page-title">Profile</div>
</header>

<main>
  <div class="status" id="status"></div>
  <pre id="content" hidden></pre>
</main>

<script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var n = params.get('n');
    var statusEl = document.getElementById('status');
    var contentEl = document.getElementById('content');
    var titleEl = document.getElementById('page-title');

    if (!n || !/^[0-9]+$/.test(n)) {
      statusEl.textContent = 'No profile specified.';
      return;
    }

    titleEl.textContent = 'Profile #' + n;
    document.title = 'Profile #' + n + ' — Texas Hold \'Em';
    statusEl.textContent = 'Loading…';

    fetch('profiles/' + n + '.md')
      .then(function(res) {
        if (!res.ok) throw new Error('Not found');
        return res.text();
      })
      .then(function(text) {
        statusEl.textContent = '';
        contentEl.textContent = text;
        contentEl.hidden = false;
      })
      .catch(function() {
        statusEl.textContent = 'Profile not found.';
      });
  })();
</script>

</body>
</html>
