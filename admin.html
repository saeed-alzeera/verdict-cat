<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<script src="gist.js?v=3"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d23;
    --border: #2e3238;
    --text: #e8eaed;
    --muted: #8b9099;
    --accent: #5b9bd5;
    --green: #4caf82;
    --red: #e05c5c;
    --warn: #e8a730;
  }

  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  header {
    padding: 28px 40px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header .sub { font-size: 13px; color: var(--muted); }
  #hub-back {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
    text-decoration: none; padding: 5px 11px;
    border: 1px solid var(--border); border-radius: 6px;
    white-space: nowrap; flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  #hub-back:hover { color: var(--accent); border-color: var(--accent); }

  main { max-width: 560px; margin: 48px auto; padding: 0 24px; }

  section { margin-bottom: 36px; }
  section h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 12px;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); }

  .row { display: flex; gap: 12px; }
  .row input { flex: 1; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 12px;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(91,155,213,0.05); }
  .drop-zone p { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .drop-zone .icon { font-size: 32px; }
  .drop-zone .file-name { font-size: 13px; color: var(--accent); margin-top: 6px; font-weight: 500; }
  #epub-input { display: none; }

  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.secondary { background: none; border: 1px solid var(--border); color: var(--muted); }
  button.secondary:hover { border-color: var(--muted); opacity: 1; }
  button.danger { background: none; border: 1px solid var(--border); color: var(--red); }

  .status-bar {
    margin-top: 14px;
    font-size: 13px;
    min-height: 20px;
    color: var(--muted);
  }
  .status-bar.ok  { color: var(--green); }
  .status-bar.err { color: var(--red); }
  .status-bar.working { color: var(--accent); }

  .pat-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 0; }
  .pat-row input { flex: 1; margin-bottom: 0; }
  .pat-row button { width: auto; padding: 10px 16px; flex-shrink: 0; }

  .pat-status { font-size: 12px; margin-top: 8px; min-height: 16px; color: var(--muted); }
  .pat-status.ok  { color: var(--green); }
  .pat-status.err { color: var(--red); }

  .book-list { display: flex; flex-direction: column; gap: 8px; }
  .book-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .book-item .book-title { flex: 1; font-weight: 500; }
  .book-item .book-author { color: var(--muted); font-size: 12px; }
  .book-item .book-icon { font-size: 18px; }
</style>
</head>
<body>

<header>
  <a id="hub-back" href="index.html">&#8592; Hub</a>
  <div>
    <h1>Admin</h1>
    <div class="sub">Manage library books</div>
  </div>
</header>

<main>

  <!-- Sync key -->
  <section>
    <h2>Sync Key</h2>
    <div class="card">
      <label for="pat-input">Sync key (used for uploads and sync)</label>
      <div class="pat-row">
        <input type="password" id="pat-input" placeholder="Sync key" autocomplete="off" />
        <button onclick="savePat()">Save</button>
        <button class="secondary" onclick="clearPat()">Clear</button>
      </div>
      <div class="pat-status" id="pat-status"></div>
    </div>
  </section>

  <!-- Upload -->
  <section>
    <h2>Upload New Book</h2>
    <div class="card">
      <label>EPUB File</label>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('epub-input').click()">
        <div class="icon">📂</div>
        <p>Click or drag &amp; drop an .epub file</p>
        <div class="file-name" id="file-name"></div>
      </div>
      <input type="file" id="epub-input" accept=".epub" />

      <div class="row">
        <div style="flex:1;">
          <label for="book-title">Title</label>
          <input type="text" id="book-title" placeholder="Book Title" />
        </div>
        <div style="flex:1;">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" placeholder="Author Name" />
        </div>
      </div>

      <label for="book-slug">Slug (auto-filled, editable)</label>
      <input type="text" id="book-slug" placeholder="book-slug" />

      <button id="upload-btn" onclick="uploadBook()" disabled>Upload Book</button>
      <div class="status-bar" id="upload-status"></div>
    </div>
  </section>

  <!-- Book List -->
  <section>
    <h2>Current Books</h2>
    <div class="book-list" id="book-list">
      <div style="font-size:13px;color:var(--muted);">Loading…</div>
    </div>
  </section>

</main>

<script>
  var selectedFile = null;

  // ── Sync key storage ──────────────────────────────────────────────────────
  function hasKey() { return Gist.mode() === 'worker'; }

  async function savePat() {
    var val = document.getElementById('pat-input').value.trim();
    if (!val) { setPatStatus('err', 'Key cannot be empty.'); return; }
    setPatStatus('', 'Checking…');
    try {
      var id = await Gist.connect(val);
      if (id !== 'worker') { setPatStatus('err', 'That looks like a GitHub token. Paste your sync key instead.'); return; }
      Gist.save(val, id);
      document.getElementById('pat-input').value = '';
      setPatStatus('ok', 'Key saved.');
      checkUploadReady();
      loadBookList();
    } catch (e) {
      setPatStatus('err', e.message || 'Could not connect.');
    }
  }

  function clearPat() {
    Gist.clear();
    document.getElementById('pat-input').value = '';
    setPatStatus('', 'Key cleared.');
    checkUploadReady();
    loadBookList();
  }

  function setPatStatus(cls, msg) {
    var el = document.getElementById('pat-status');
    el.className = 'pat-status' + (cls ? ' ' + cls : '');
    el.textContent = msg;
  }

  // ── File picker / drop zone ───────────────────────────────────────────────
  var dropZone = document.getElementById('drop-zone');

  dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', function() {
    dropZone.classList.remove('drag-over');
  });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    var file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });

  document.getElementById('epub-input').addEventListener('change', function() {
    if (this.files[0]) setFile(this.files[0]);
  });

  function setFile(file) {
    if (!file.name.endsWith('.epub')) {
      setUploadStatus('err', 'Please select a .epub file.');
      return;
    }
    selectedFile = file;
    document.getElementById('file-name').textContent = file.name;
    // auto-fill slug from filename
    var slug = file.name.replace(/\.epub$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    document.getElementById('book-slug').value = slug;
    checkUploadReady();
  }

  document.getElementById('book-title').addEventListener('input', checkUploadReady);
  document.getElementById('book-author').addEventListener('input', checkUploadReady);
  document.getElementById('book-slug').addEventListener('input', checkUploadReady);

  function checkUploadReady() {
    var ready = selectedFile &&
      hasKey() &&
      document.getElementById('book-title').value.trim() &&
      document.getElementById('book-author').value.trim() &&
      document.getElementById('book-slug').value.trim();
    document.getElementById('upload-btn').disabled = !ready;
  }

  // ── Upload flow ───────────────────────────────────────────────────────────
  async function uploadBook() {
    var title  = document.getElementById('book-title').value.trim();
    var author = document.getElementById('book-author').value.trim();
    var slug   = document.getElementById('book-slug').value.trim();
    var btn    = document.getElementById('upload-btn');

    if (!/^[a-z0-9][a-z0-9-]*$/.test(slug)) {
      setUploadStatus('err', 'Slug may only contain lowercase letters, numbers and hyphens.');
      return;
    }
    btn.disabled = true;

    try {
      setUploadStatus('working', 'Uploading…');
      await Gist.books.upload({ slug: slug, title: title, author: author, epub: selectedFile });

      setUploadStatus('ok', 'Done! "' + title + '" added to the library.');
      selectedFile = null;
      document.getElementById('file-name').textContent = '';
      document.getElementById('epub-input').value = '';
      document.getElementById('book-title').value = '';
      document.getElementById('book-author').value = '';
      document.getElementById('book-slug').value = '';
      checkUploadReady();
      loadBookList();

    } catch(err) {
      setUploadStatus('err', err.message || 'Upload failed.');
      btn.disabled = false;
      checkUploadReady();
    }
  }

  function setUploadStatus(cls, msg) {
    var el = document.getElementById('upload-status');
    el.className = 'status-bar' + (cls ? ' ' + cls : '');
    el.textContent = msg;
  }

  // ── Book list ─────────────────────────────────────────────────────────────
  // Books baked into library.html plus those uploaded through the sync worker
  // (minus any the worker has marked deleted).
  async function loadBookList() {
    var el = document.getElementById('book-list');
    try {
      var src = await (await fetch('library.html', { cache: 'no-store' })).text();
      var m = src.match(/var BOOKS = \[([\s\S]*?)\];/);
      var books = [];
      if (m) {
        var re = /slug:\s*'([^']+)'[\s\S]*?title:\s*([^\n,]+)[\s\S]*?author:\s*([^\n,]+)/g;
        var match;
        while ((match = re.exec(m[1])) !== null) {
          books.push({
            slug: match[1],
            title: match[2].trim().replace(/^["']|["']$/g, ''),
            author: match[3].trim().replace(/^["']|["']$/g, '')
          });
        }
      }
      var remote = [];
      try { remote = await Gist.books.list(); } catch(e) {}
      var hidden = {}, uploaded = {};
      remote.forEach(function(b) { if (b.hidden) hidden[b.slug] = true; else uploaded[b.slug] = b; });
      books = books.filter(function(b) { return !hidden[b.slug] && !uploaded[b.slug]; });
      remote.filter(function(b) { return !b.hidden; }).forEach(function(b) {
        books.push({ slug: b.slug, title: b.title, author: b.author });
      });
      if (!books.length) {
        el.innerHTML = '<div style="font-size:13px;color:var(--muted);">No books yet.</div>';
        return;
      }
      el.innerHTML = '';
      books.forEach(function(b) {
        var item = document.createElement('div');
        item.className = 'book-item';
        item.innerHTML = '<span class="book-icon">📖</span><div><div class="book-title">' + escHtml(b.title) + '</div><div class="book-author">' + escHtml(b.author) + '</div></div>';
        el.appendChild(item);
      });
    } catch(e) {
      el.innerHTML = '<div style="font-size:13px;color:var(--red);">' + escHtml(e.message) + '</div>';
    }
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  if (hasKey()) setPatStatus('ok', 'Key loaded from storage.');
  loadBookList();
  checkUploadReady();
</script>
</body>
</html>
