name: Deploy Scrabble Worker

on:
  push:
    branches: [main]
    paths:
      - "scrabble-worker/**"
      # the Worker bundles the shared engine, icon list and word list
      - "games/scrabble/engine.js"
      - "games/scrabble/icons.js"
      - "games/scrabble/enable.txt"
      # Ludo rooms run in the same Worker
      - "games/ludo/engine.js"
      - ".github/workflows/deploy-scrabble-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-scrabble-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        run: |
          node games/scrabble/engine.test.js
          node scrabble-worker/src/room.test.js
          node games/ludo/engine.test.js
          node scrabble-worker/src/ludo-room.test.js

      # No secret to set: room creation is authorised by asking the sync worker (service
      # binding SYNC), so the sync key is only ever stored there.
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "scrabble-worker"
