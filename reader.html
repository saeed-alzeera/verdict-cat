<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1117" />
<title>Reader</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="gist.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d23;
    --border: #2e3238;
    --text: #e8eaed;
    --muted: #8b9099;
    --accent: #5b9bd5;
    --bar-h: 52px;
    --yellow-bg: #f4ecd8;
    --yellow-surface: #ece2c8;
    --yellow-text: #3b2f1e;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--bar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    z-index: 100;
  }

  #back-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  #back-btn:hover { color: var(--accent); border-color: var(--accent); }

  #book-title {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    flex-shrink: 0;
  }

  #chapter-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    padding-left: 4px;
    border-left: 1px solid var(--border);
  }

  #font-size-label {
    font-size: 11px;
    color: var(--muted);
    min-width: 32px;
    text-align: center;
  }

  #progress-bar {
    width: 120px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s ease;
  }

  #viewer-wrap {
    position: fixed;
    top: var(--bar-h);
    left: 60px;
    right: 60px;
    bottom: var(--bar-h);
  }

  #viewer { width: 100%; height: 100%; }

  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    z-index: 50;
  }
  .nav-btn:hover { background: #252830; border-color: var(--accent); }
  #prev-btn { left: 8px; }
  #next-btn { right: 8px; }

  #bottombar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--bar-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }

  .bar-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    touch-action: manipulation;
  }
  .bar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .bar-btn:disabled { opacity: 0.55; cursor: default; }

  #saved-badge {
    font-size: 11px;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.4s;
  }
  #saved-badge.show { opacity: 1; }

  #toc-panel {
    position: fixed;
    top: var(--bar-h);
    left: 0;
    bottom: var(--bar-h);
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    z-index: 90;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    padding: 12px 0;
  }
  #toc-panel.open { transform: translateX(0); }
  #toc-panel h3 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 16px 8px;
  }
  #toc-list { list-style: none; }
  #toc-list li a {
    display: block;
    padding: 7px 16px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.12s;
    cursor: pointer;
  }
  #toc-list li a:hover { background: rgba(91,155,213,0.12); color: var(--accent); }
  #toc-list li a.active { color: var(--accent); background: rgba(91,155,213,0.08); }

  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    z-index: 200;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text { font-size: 13px; color: var(--muted); }

  #error-msg {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
  }
  #error-msg p { font-size: 14px; color: var(--muted); text-align: center; padding: 0 24px; }
  #error-msg a { color: var(--accent); text-decoration: none; font-size: 13px; }

  #tap-zone { display: none; }

  #mobile-custom-btn { display: none; }
  #custom-overlay { display: none; }
  #custom-panel { display: none; }

  /* ── Mobile reader mode ──────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    html, body { background: #000 !important; }

    #tap-zone {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 10;
      touch-action: manipulation;
    }

    #prev-btn, #next-btn { display: none !important; }

    #topbar, #bottombar { display: none !important; }

    #viewer-wrap {
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }

    #toc-panel { top: 0 !important; bottom: 0 !important; z-index: 120; }

    #mobile-custom-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      z-index: 110;
      background: rgba(20, 20, 20, 0.85);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      touch-action: manipulation;
    }

    #custom-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 130;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #custom-overlay.show { display: block; opacity: 1; pointer-events: auto; }

    #custom-panel {
      display: block;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 82vh;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      z-index: 140;
      padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
      will-change: transform;
    }
    #custom-panel.open { transform: translateY(0); }

    #custom-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #custom-panel-header h3 { font-size: 15px; font-weight: 600; }
    #panel-back {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
    }
    #custom-panel-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
      touch-action: manipulation;
    }
    #panel-progress {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .panel-section { margin-bottom: 16px; }
    .panel-section h4 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .panel-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .panel-opt-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 9px 8px;
      cursor: pointer;
      touch-action: manipulation;
      text-align: center;
    }
    .panel-opt-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(91,155,213,0.12);
    }
    .theme-opt[data-theme="yellow"].active {
      border-color: #c9a227;
      color: #c9a227;
      background: rgba(201,162,39,0.14);
    }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-text">Loading book…</div>
</div>

<div id="error-msg">
  <p id="error-detail">Could not load the book.</p>
</div>

<div id="topbar">
  <a id="back-btn" href="library.html">&#8592; Library</a>
  <span id="book-title">—</span>
  <div id="progress-wrap">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <span id="progress-label">—</span>
    <span id="chapter-time"></span>
  </div>
</div>

<button id="prev-btn" class="nav-btn" title="Previous page">&#8592;</button>

<div id="viewer-wrap">
  <div id="viewer"></div>
</div>

<div id="tap-zone"></div>

<button id="next-btn" class="nav-btn" title="Next page">&#8594;</button>

<div id="bottombar">
  <button class="bar-btn" id="toc-toggle">Contents</button>
  <button class="bar-btn" id="font-dec">A&#8722;</button>
  <span id="font-size-label">160%</span>
  <button class="bar-btn" id="font-inc">A+</button>
  <button class="bar-btn" id="theme-toggle">Light / Dark</button>
  <button class="bar-btn" id="sync-btn" title="Sync reading progress now">Sync</button>
  <span id="saved-badge">Saved</span>
</div>

<div id="toc-panel">
  <h3>Contents</h3>
  <ul id="toc-list"></ul>
</div>

<button id="mobile-custom-btn" title="Customization">&#9881; Customization</button>
<div id="custom-overlay"></div>
<div id="custom-panel">
  <div id="custom-panel-header">
    <a id="panel-back" href="library.html">&#8592; Library</a>
    <h3>Customization</h3>
    <button id="custom-panel-close" title="Close">&#10005;</button>
  </div>
  <div id="panel-progress"><span id="m-progress-label">—</span><span id="m-chapter-time"></span></div>

  <div class="panel-section">
    <h4>Font Size</h4>
    <div class="panel-row">
      <button class="panel-opt-btn" id="m-font-dec">A&#8722;</button>
      <span id="m-font-size-label">160%</span>
      <button class="panel-opt-btn" id="m-font-inc">A+</button>
    </div>
  </div>

  <div class="panel-section">
    <h4>Reading Mode</h4>
    <div class="panel-row">
      <button class="panel-opt-btn readmode-opt" data-mode="paginated">Flip Book</button>
      <button class="panel-opt-btn readmode-opt" data-mode="scrolled">Continuous Scroll</button>
    </div>
  </div>

  <div class="panel-section">
    <h4>Table of Contents</h4>
    <div class="panel-row">
      <button class="panel-opt-btn" id="m-toc-toggle">Open Contents</button>
    </div>
  </div>

  <div class="panel-section">
    <h4>Theme</h4>
    <div class="panel-row">
      <button class="panel-opt-btn theme-opt" data-theme="light">Light</button>
      <button class="panel-opt-btn theme-opt" data-theme="dark">Dark</button>
      <button class="panel-opt-btn theme-opt" data-theme="yellow">Yellow</button>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-row">
      <button class="panel-opt-btn" id="m-sync-btn">Sync</button>
      <span id="m-saved-badge" style="font-size:11px;color:var(--muted);opacity:0;transition:opacity 0.4s;">Saved</span>
    </div>
  </div>
</div>

<script>
  var isMobile = window.matchMedia('(max-width: 768px)').matches;

  // ── Book catalogue (slug → raw GitHub URL) ────────────────────────────────
  var BOOKS = {




    "east-of-eden-john-steinbeck-z-library-sk-1lib-sk-z-lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/east-of-eden-john-steinbeck-z-library-sk-1lib-sk-z-lib-sk.epub",
      title: "East of Eden",
      author: "John Steinbeck"
    },
    "enders-game-orson-scott-card-z-library-sk-1lib-sk-z-lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/enders-game-orson-scott-card-z-library-sk-1lib-sk-z-lib-sk.epub",
      title: "Ender's Game (Ender Wiggins Saga)",
      author: "Orson Scott Card"
    },
    "the-yacoubian-building-alaa-al-aswany": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/the-yacoubian-building-alaa-al-aswany.epub",
      title: "The Yacoubian Building",
      author: "Alaa Al Aswany"
    },
    "welcome-to-glorious-tuga-francesca-segal": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/welcome-to-glorious-tuga-francesca-segal.epub",
      title: "Welcome to Glorious Tuga",
      author: "Francesca Segal"
    },
    "the-list-of-suspicious-things-jennie-z-library-sk-1lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/the-list-of-suspicious-things-jennie-z-library-sk-1lib-sk.epub",
      title: "The List of Suspicious Things",
      author: "Godfrey, Jennie"
    },
    "lakeshire-park-megan-walker-z-library-sk-1lib-sk-z-lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/lakeshire-park-megan-walker-z-library-sk-1lib-sk-z-lib-sk.epub",
      title: "Lakeshire Park",
      author: "Megan Walker"
    },
    "lakeshire-park-megan-walker-z-library-sk-1lib-sk-z-lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/lakeshire-park-megan-walker-z-library-sk-1lib-sk-z-lib-sk.epub",
      title: "Lakeshire Park",
      author: "Megan Walker"
    },
    "the-library-at-mount-char-scott-hawk-z-library-sk-1lib-sk": {
      url: "https://raw.githubusercontent.com/saeed-alzeera/verdict-cat/main/books/the-library-at-mount-char-scott-hawk-z-library-sk-1lib-sk.epub",
      title: "The Library at Mount Char",
      author: "Scott Hawkins"
    }
  };
  // ─────────────────────────────────────────────────────────────────────────

  var params = new URLSearchParams(location.search);
  var slug = params.get('book');
  var bookMeta = slug && BOOKS[slug];

  function storageKey() { return 'epub-progress:' + slug; }

  var lastGistChapter = null;
  var gistIdleTimer   = null;

  function saveProgress(cfi) {
    try {
      localStorage.setItem(storageKey(), cfi);
      Gist.touchProgress(storageKey(), Date.now());
    } catch(e) {}
    var badge = document.getElementById('saved-badge');
    badge.classList.add('show');
    setTimeout(function() { badge.classList.remove('show'); }, 1200);
    var mBadge = document.getElementById('m-saved-badge');
    mBadge.style.opacity = '1';
    setTimeout(function() { mBadge.style.opacity = '0'; }, 1200);
  }

  function loadProgress() {
    try { return localStorage.getItem(storageKey()); } catch(e) { return null; }
  }

  // Push to Gist: immediately on chapter change, debounced (30s) within a chapter
  function scheduleGistPush(immediate) {
    clearTimeout(gistIdleTimer);
    if (immediate) { Gist.push(); }
    else { gistIdleTimer = setTimeout(function() { Gist.push(); }, 30000); }
  }

  window.addEventListener('beforeunload', function() { Gist.push(); });
  // beforeunload doesn't fire reliably on mobile (tab backgrounding, bfcache),
  // so also flush whenever the page is hidden — the actual point a reader
  // stops reading on a phone.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') Gist.push();
  });

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    var el = document.getElementById('error-msg');
    el.style.display = 'flex';
    document.getElementById('error-detail').textContent = msg || 'Could not load the book.';
  }

  if (!bookMeta) {
    showError('Unknown book. Please select a book from the library.');
  } else {
    document.getElementById('book-title').textContent = bookMeta.title;
    document.title = bookMeta.title;

    var book = ePub(bookMeta.url);
    var rendition = book.renderTo('viewer', { width: '100%', height: '100%', spread: isMobile ? 'none' : 'always' });
    var fontSize = isMobile ? 140 : 160;
    var chapterWordCounts = {};

    var THEME_PALETTES = {
      dark:   { bg: isMobile ? '#000000' : '#0f1117', color: '#e8eaed', appBg: isMobile ? '#000000' : '#0f1117' },
      light:  { bg: '#fafafa', color: '#1a1a1a', appBg: '#f0f0f0' },
      yellow: { bg: '#f4ecd8', color: '#3b2f1e', appBg: '#ece2c8' }
    };
    var theme = 'dark';
    var readMode = 'paginated';

    function countWordsInDoc(doc) {
      var text = doc.body ? (doc.body.innerText || doc.body.textContent || '') : '';
      return text.trim().split(/\s+/).filter(Boolean).length;
    }

    function applyTheme() {
      var p = THEME_PALETTES[theme];
      rendition.themes.override('background', p.bg);
      rendition.themes.override('color', p.color);
      rendition.themes.override('line-height', '1.7');
      document.body.style.background = p.appBg;
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute('content', p.appBg);
      document.querySelectorAll('.theme-opt').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.theme === theme);
      });
    }

    function setTheme(t) {
      theme = t;
      applyTheme();
    }

    function applyReadMode() {
      rendition.flow(readMode === 'scrolled' ? 'scrolled-doc' : 'paginated');
      document.querySelectorAll('.readmode-opt').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.mode === readMode);
      });
    }

    function setReadMode(mode) {
      readMode = mode;
      applyReadMode();
    }

    var lastKnownCfi = loadProgress() || null;

    // Pull the latest synced position before opening — otherwise a stale
    // localStorage entry (e.g. from before progress made on another device)
    // decides where the book opens, and reading elsewhere never "sticks".
    var openPromise = (Gist.isConnected() ? Gist.pull() : Promise.resolve([])).then(function() {
      var savedCfi = loadProgress();
      lastKnownCfi = savedCfi || null;
      return savedCfi ? rendition.display(savedCfi) : rendition.display();
    });

    openPromise.then(function() {
      document.getElementById('loading').style.display = 'none';
      rendition.themes.fontSize(fontSize + '%');
      document.getElementById('font-size-label').textContent = fontSize + '%';
      document.getElementById('m-font-size-label').textContent = fontSize + '%';
      applyTheme();
      if (isMobile) applyReadMode();
    }).catch(function() {
      // Saved CFI might be stale; fall back to beginning
      rendition.display().then(function() {
        document.getElementById('loading').style.display = 'none';
        applyTheme();
        if (isMobile) applyReadMode();
      }).catch(function(err) {
        showError('Failed to render book: ' + (err && err.message));
      });
    });

    function updateProgressBar(cfi) {
      var pct = book.locations.percentageFromCfi(cfi);
      if (pct !== undefined && !isNaN(pct) && pct > 0) {
        document.getElementById('progress-fill').style.width = (pct * 100).toFixed(1) + '%';
        document.getElementById('progress-label').textContent = Math.round(pct * 100) + '%';
        document.getElementById('m-progress-label').textContent = Math.round(pct * 100) + '% read';
      }
    }

    // Save progress on every page turn; push to Gist on chapter change or after 30s idle
    rendition.on('relocated', function(loc) {
      if (!loc || !loc.start) return;
      lastKnownCfi = loc.start.cfi;
      saveProgress(loc.start.cfi);
      var chapterChanged = loc.start.href !== lastGistChapter;
      if (chapterChanged) lastGistChapter = loc.start.href;
      scheduleGistPush(chapterChanged);

      // Update progress bar (may be a no-op if locations aren't generated yet;
      // book.ready.then handles the re-apply after generation)
      updateProgressBar(loc.start.cfi);

      // Minutes left in chapter
      var chapterHref = loc.start.href ? loc.start.href.split('#')[0] : '';
      var posInChapter = (loc.start.percentage !== undefined && !isNaN(loc.start.percentage))
        ? loc.start.percentage : 0;
      try {
        var contents = rendition.getContents();
        if (contents && contents.length > 0 && contents[0].document) {
          if (!chapterWordCounts[chapterHref]) {
            chapterWordCounts[chapterHref] = countWordsInDoc(contents[0].document);
          }
          var totalWords = chapterWordCounts[chapterHref] || 0;
          if (totalWords > 0) {
            var wordsLeft = Math.round(totalWords * (1 - posInChapter));
            var minsLeft = Math.ceil(wordsLeft / 250);
            var timeText = minsLeft <= 1 ? '< 1 min left' : minsLeft + ' min left';
            document.getElementById('chapter-time').textContent = timeText;
            document.getElementById('m-chapter-time').textContent = ' · ' + timeText;
          }
        }
      } catch(e) {}

      // Highlight active TOC entry (strip fragment from both sides before comparing)
      var locBase = loc.start.href ? loc.start.href.split('#')[0] : '';
      document.querySelectorAll('#toc-list li a').forEach(function(a) {
        a.classList.toggle('active', a.dataset.hrefBase === locBase);
      });
    });

    book.ready.then(function() {
      var locKey = 'epub-locations:' + slug;
      var cached = localStorage.getItem(locKey);
      if (cached) {
        book.locations.load(cached);
        return Promise.resolve();
      }
      return book.locations.generate(1000).then(function() {
        try { localStorage.setItem(locKey, book.locations.save()); } catch(e) {}
      });
    }).then(function() {
      if (lastKnownCfi) updateProgressBar(lastKnownCfi);
    }).catch(function() {});

    book.loaded.navigation.then(function(nav) {
      var list = document.getElementById('toc-list');

      function addTocItems(items, container, depth) {
        items.forEach(function(item) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#';
          a.textContent = item.label.trim();
          a.dataset.href = item.href;
          a.dataset.hrefBase = item.href ? item.href.split('#')[0] : '';
          if (depth > 0) {
            a.style.paddingLeft = (16 + depth * 14) + 'px';
            a.style.fontSize = '12px';
            a.style.color = 'var(--muted)';
          }
          function doNavigate(navHref) {
            var base = navHref.split('#')[0];
            var norm = base.replace(/^\//, '').toLowerCase();
            document.getElementById('toc-panel').classList.remove('open');
            // Iterate spine.items directly so href format differences don't matter
            var found = null;
            var items = book.spine.items;
            for (var j = 0; j < items.length; j++) {
              var si = items[j];
              if (si && si.href) {
                var siNorm = si.href.split('#')[0].replace(/^\//, '').toLowerCase();
                if (siNorm === norm) { found = si; break; }
              }
            }
            var target = found ? found.href : base;
            rendition.display(target).catch(function() {
              rendition.display(base).catch(function() {});
            });
          }
          a.addEventListener('click', function(e) {
            e.preventDefault();
            doNavigate(item.href);
          });
          // iOS Safari: click can silently fail in fixed+overflow-scroll containers
          var _tStart = null;
          a.addEventListener('touchstart', function(e) {
            _tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }, { passive: true });
          a.addEventListener('touchend', function(e) {
            if (!_tStart) return;
            var dx = e.changedTouches[0].clientX - _tStart.x;
            var dy = e.changedTouches[0].clientY - _tStart.y;
            _tStart = null;
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {
              e.preventDefault();
              doNavigate(item.href);
            }
          });
          li.appendChild(a);
          container.appendChild(li);
          if (item.subitems && item.subitems.length) {
            addTocItems(item.subitems, container, depth + 1);
          }
        });
      }

      addTocItems(nav.toc, list, 0);
    });

    document.getElementById('prev-btn').addEventListener('click', function() { rendition.prev(); });
    document.getElementById('next-btn').addEventListener('click', function() { rendition.next(); });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft')  rendition.prev();
      if (e.key === 'ArrowRight') rendition.next();
    });
    // ── Mobile tap navigation ─────────────────────────────────────────────────
    if (isMobile) {
      var tapZone = document.getElementById('tap-zone');
      var tzStart = {};
      tapZone.addEventListener('touchstart', function(e) {
        tzStart.t = Date.now();
        tzStart.x = e.touches[0].clientX;
        tzStart.y = e.touches[0].clientY;
      }, { passive: true });
      tapZone.addEventListener('touchend', function(e) {
        var dx = e.changedTouches[0].clientX - tzStart.x;
        var dy = e.changedTouches[0].clientY - tzStart.y;
        if (Math.abs(dx) > 20 || Math.abs(dy) > 20) return;
        if (Date.now() - tzStart.t >= 500) return;
        if (tzStart.y < window.innerHeight * 0.15) {
          openCustomPanel();
        } else if (tzStart.x < window.innerWidth / 2) {
          rendition.prev();
        } else {
          rendition.next();
        }
      });
    }

    function incFont() {
      fontSize = Math.min(fontSize + 10, 200);
      rendition.themes.fontSize(fontSize + '%');
      document.getElementById('font-size-label').textContent = fontSize + '%';
      document.getElementById('m-font-size-label').textContent = fontSize + '%';
    }
    function decFont() {
      fontSize = Math.max(fontSize - 10, 60);
      rendition.themes.fontSize(fontSize + '%');
      document.getElementById('font-size-label').textContent = fontSize + '%';
      document.getElementById('m-font-size-label').textContent = fontSize + '%';
    }
    document.getElementById('font-inc').addEventListener('click', incFont);
    document.getElementById('font-dec').addEventListener('click', decFont);
    document.getElementById('theme-toggle').addEventListener('click', function() {
      setTheme(theme === 'dark' ? 'light' : 'dark');
    });

    function runSync(btn) {
      if (!Gist.isConnected()) { alert('Connect GitHub sync from the Library page first.'); return; }
      btn.disabled = true;
      btn.textContent = 'Syncing…';
      Gist.sync().then(function(changedKeys) {
        var changedThisBook = changedKeys.indexOf(storageKey()) !== -1;
        if (changedThisBook) {
          var latestCfi = loadProgress();
          if (latestCfi && latestCfi !== lastKnownCfi) {
            lastKnownCfi = latestCfi;
            rendition.display(latestCfi);
          }
        }
        btn.textContent = changedThisBook ? 'Synced ↻' : 'Synced';
        setTimeout(function() { btn.textContent = 'Sync'; btn.disabled = false; }, 1600);
      }).catch(function() {
        btn.textContent = 'Sync failed';
        setTimeout(function() { btn.textContent = 'Sync'; btn.disabled = false; }, 1600);
      });
    }

    document.getElementById('sync-btn').addEventListener('click', function() { runSync(this); });

    function openCustomPanel() {
      document.getElementById('custom-panel').classList.add('open');
      document.getElementById('custom-overlay').classList.add('show');
    }
    function closeCustomPanel() {
      document.getElementById('custom-panel').classList.remove('open');
      document.getElementById('custom-overlay').classList.remove('show');
    }
    document.getElementById('mobile-custom-btn').addEventListener('click', openCustomPanel);
    document.getElementById('custom-panel-close').addEventListener('click', closeCustomPanel);
    document.getElementById('custom-overlay').addEventListener('click', closeCustomPanel);

    document.getElementById('m-font-inc').addEventListener('click', incFont);
    document.getElementById('m-font-dec').addEventListener('click', decFont);
    document.getElementById('m-sync-btn').addEventListener('click', function() { runSync(this); });
    document.getElementById('m-toc-toggle').addEventListener('click', function() {
      closeCustomPanel();
      document.getElementById('toc-panel').classList.toggle('open');
    });
    document.querySelectorAll('.theme-opt').forEach(function(btn) {
      btn.addEventListener('click', function() { setTheme(btn.dataset.theme); });
    });
    document.querySelectorAll('.readmode-opt').forEach(function(btn) {
      btn.addEventListener('click', function() { setReadMode(btn.dataset.mode); });
    });
  }

  document.getElementById('toc-toggle').addEventListener('click', function() {
    document.getElementById('toc-panel').classList.toggle('open');
  });
</script>
</body>
</html>
