<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Texas</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="stylesheet" href="site.css" />
<script src="site.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d23;
    --border: #2e3238;
    --text: #e8eaed;
    --muted: #8b9099;
    --accent: #5b9bd5;
    --card-hover: #1f2229;
  }

  html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  header {
    padding: 28px 40px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header a.back { color: var(--muted); text-decoration: none; font-size: 0.8125rem; }
  header a.back:hover { color: var(--text); }
  header h1 { font-size: 1.625rem; font-weight: 700; letter-spacing: -0.02em; }
  header .sub { font-size: 0.8125rem; color: var(--muted); flex: 1; }

  main { max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; }

  .profile-list { display: flex; flex-direction: column; gap: 10px; }
  .profile-card {
    display: block;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  @media (hover: hover) { .profile-card:hover { border-color: var(--accent); background: var(--card-hover); } }
  .profile-card { animation: rise 0.45s cubic-bezier(0.32, 0.72, 0, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .profile-card .num { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .profile-card .title { font-size: 1rem; font-weight: 600; margin-top: 4px; }

  .empty { color: var(--muted); font-size: 0.875rem; padding: 20px 0; }
</style>
</head>
<body>

<header class="vc-sticky">
  <a class="back" href="reso.html">&larr; Reso</a>
  <h1>Texas</h1>
  <div class="sub">Due-diligence profiles</div>
</header>

<main>
  <div class="profile-list" id="profile-list"></div>
  <div class="empty" id="empty-msg" hidden>No profiles yet.</div>
</main>

<script>
  // Add one entry here each time a new profile is generated.
  // Titles are numbered only — no names/companies in this index or the URL.
  var PROFILES = [
    { n: 1, title: "Profile 1" },
    { n: 2, title: "Profile 2" },
    { n: 3, title: "Profile 3" },
    { n: 4, title: "Profile 4" }
  ];

  (function render() {
    var list = document.getElementById('profile-list');
    var empty = document.getElementById('empty-msg');
    if (!PROFILES.length) { empty.hidden = false; return; }
    PROFILES.slice().reverse().forEach(function(p, i) {
      var a = document.createElement('a');
      a.className = 'profile-card vc-pressable';
      a.style.setProperty('--i', i);
      a.href = 'texas/profile.html?n=' + encodeURIComponent(p.n);
      a.innerHTML = '<div class="num">Profile #' + p.n + '</div><div class="title">' + p.title + '</div>';
      list.appendChild(a);
    });
  })();
</script>

</body>
</html>
